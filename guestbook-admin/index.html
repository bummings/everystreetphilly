<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Guestbook moderation · Every Street Philly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="guestbook-admin page-shell">
      <p class="eyebrow">every street philly · private</p>
      <h1>Guestbook moderation</h1>
      <p class="admin-intro">Notes stay private until you approve them. This page is not linked from the public site; access is protected by your Netlify secret.</p>

      <p id="admin-status" class="admin-status" role="status" aria-live="polite"></p>
      <form id="admin-login" class="admin-login">
        <label for="admin-token">Admin access token</label>
        <div class="admin-login-row">
          <input id="admin-token" type="password" autocomplete="current-password" required />
          <button type="submit">Open inbox</button>
        </div>
      </form>
      <div class="admin-toolbar" hidden>
        <button id="admin-refresh" type="button">Refresh</button>
        <button id="admin-sign-out" type="button" class="quiet-button">Sign out</button>
      </div>
      <section id="admin-entries" aria-live="polite"></section>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
